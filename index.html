<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorAI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 25px;
      padding: 18px;
      border-radius: 10px;
      background: #1e293b;
      white-space: pre-wrap;
      line-height: 1.6;
      min-height: 100px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 CreatorAI</h1>
    <div class="subtitle">AI YouTube Script Generator</div>

    <label>Topic</label>
    <input
      id="topic"
      type="text"
      placeholder="Example: AI tools for students"
    >

    <label>Language</label>
    <select id="language">
      <option value="English">English</option>
      <option value="Telugu">Telugu</option>
      <option value="Hindi">Hindi</option>
    </select>

    <label>Video Type</label>
    <select id="type">
      <option value="Long Video">Long Video</option>
      <option value="Short Video">Short Video</option>
    </select>

    <button id="generateBtn" onclick="generateScript()">
      Generate Script 🚀
    </button>

    <div id="result">Your AI-generated script will appear here...</div>

  </div>

  <script>
    async function generateScript() {

      const topic = document.getElementById("topic").value.trim();
      const language = document.getElementById("language").value;
      const type = document.getElementById("type").value;
      const result = document.getElementById("result");
      const button = document.getElementById("generateBtn");

      if (!topic) {
        result.textContent = "Please enter a topic.";
        return;
      }

      button.disabled = true;
      button.textContent = "Generating... ⏳";
      result.textContent = "AI is creating your script...";

      try {

        const response = await fetch(
          "https://ai-backend-1.onrender.com/api/script",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              topic: topic,
              language: language,
              type: type
            })
          }
        );

        const data = await response.json();

        if (data.ok) {
          result.textContent = data.output;
        } else {
          result.textContent =
            "Error: " + (data.error || "Something went wrong");
        }

      } catch (error) {

        result.textContent =
          "Connection error. Please try again.";

        console.error(error);

      } finally {

        button.disabled = false;
        button.textContent = "Generate Script 🚀";

      }
    }
  </script>

</body>
</html>
